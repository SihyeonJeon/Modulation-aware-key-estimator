[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modulation-aware-key-estimator"
version = "0.1.0"
description = "Transformer-based region-wise key estimation for songs with modulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "torch>=2.2",
  "torchaudio>=2.2",
  "librosa>=0.10",
  "soundfile>=0.12",
  "yt-dlp>=2024.1.1",
  "numpy<2",
  "noisereduce>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mod-key-estimator = "modulation_key_estimator.cli:main"

[tool.setuptools.packages.find]
include = ["modulation_key_estimator*"]

[tool.setuptools.package-data]
modulation_key_estimator = ["assets/*.pt"]
